<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;gap:56px;
 font-family:'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;
 background:linear-gradient(150deg,#EFE9F1 0%,#DDD5E8 42%,#C6BFE3 100%);position:relative}
.b{position:absolute;border-radius:50%;filter:blur(120px)}
.b1{width:760px;height:760px;top:-280px;right:-180px;background:#7D80DA;opacity:.5}
.b2{width:620px;height:620px;bottom:-260px;left:-160px;background:#55418B;opacity:.45}
.b3{width:460px;height:460px;top:40%;left:8%;background:#BBA0A0;opacity:.45}
.tile{position:relative;width:230px;height:230px;border-radius:60px;display:grid;place-items:center;
 background:linear-gradient(155deg,#fff 0%,#F5F5F4 55%,#E5DBE6 100%);
 border:1px solid rgba(255,255,255,.9);box-shadow:0 40px 80px -34px rgba(85,65,139,.6),inset 0 2px 0 #fff}
.tile img{height:132px}
.t{position:relative;text-align:right}
.t img{width:300px;display:block;margin-bottom:22px}
.t p{margin:0;font-size:30px;color:#6B5E86;font-weight:400}
.t .u{margin-top:26px;height:6px;width:150px;border-radius:99px;background:linear-gradient(90deg,#55418B,#7D80DA,#BBA0A0)}
</style></head><body>
<span class="b b1"></span><span class="b b2"></span><span class="b b3"></span>
<div class="tile"><img src="assets/logo-mark.svg" alt=""></div>
<div class="t">
  <img src="assets/logo-wordmark.svg" alt="ريّد">
  <p>حلول وتحليلات تصنع الفرق</p>
  <div class="u"></div>
</div>
</body></html>
